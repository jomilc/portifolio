<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ilustração de restauração florestal: mudas em estágios de crescimento, regador e raízes no solo">
  <defs>
    <filter id="rs-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.033" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rs-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="rs-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#15803D" stroke-width="1.1" opacity="0.5"/>
    </pattern>
    <pattern id="rs-soil" width="9" height="9" patternTransform="rotate(-42)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#92400E" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#F7FAF5"/>
  <rect width="400" height="300" filter="url(#rs-grain)" opacity="0.07"/>

  <g filter="url(#rs-rough)" fill="none" stroke="#14532D" stroke-linecap="round" stroke-linejoin="round">
    <!-- morros ao fundo -->
    <g stroke-width="1.8" opacity="0.55">
      <path d="M0 122 C 48 88, 92 90, 130 118 C 160 96, 196 100, 222 124"/>
      <path d="M208 120 C 244 92, 288 92, 320 118 C 344 102, 374 106, 400 126"/>
    </g>

    <!-- linha do solo -->
    <path d="M0 196 C 80 190, 150 196, 220 192 C 290 188, 344 194, 400 190" stroke-width="2.8"/>
    <rect x="0" y="196" width="400" height="104" fill="url(#rs-soil)" stroke="none"/>
    <path d="M0 232 C 90 226, 180 232, 260 228 C 330 225, 366 230, 400 227" stroke-width="1.2" stroke-dasharray="8 7" opacity="0.5"/>

    <!-- 1: semente germinando -->
    <g stroke-width="2.2">
      <path d="M58 194 L 58 168"/>
      <path d="M58 176 C 44 172, 38 160, 44 152 C 54 152, 60 164, 58 176 z" fill="#ECFDF5"/>
      <path d="M58 182 C 72 178, 80 166, 74 158 C 64 158, 56 170, 58 182 z" fill="#ECFDF5"/>
      <!-- raiz -->
      <g stroke-width="1.5" opacity="0.8">
        <path d="M58 196 L 58 226 M58 208 l -12 12 M58 216 l 12 10"/>
      </g>
    </g>

    <!-- 2: muda jovem -->
    <g stroke-width="2.4">
      <path d="M140 194 L 140 140" stroke-width="2.8"/>
      <path d="M140 160 C 118 156, 108 140, 116 128 C 132 130, 142 146, 140 160 z" fill="#ECFDF5"/>
      <path d="M140 150 C 162 146, 174 130, 166 118 C 148 120, 138 136, 140 150 z" fill="#ECFDF5"/>
      <path d="M140 176 C 124 174, 116 162, 122 154 C 134 156, 142 166, 140 176 z" fill="#ECFDF5"/>
      <g stroke-width="1.5" opacity="0.8">
        <path d="M140 196 L 140 238 M140 210 l -18 16 M140 220 l 18 14 M140 230 l -10 12"/>
      </g>
      <!-- proteção da muda -->
      <g stroke-width="1.6" stroke-dasharray="6 5" opacity="0.8">
        <path d="M122 194 L 122 166 M158 194 L 158 166 M122 166 l 36 0"/>
      </g>
    </g>

    <!-- 3: árvore estabelecida -->
    <g stroke-width="2.6">
      <path d="M268 192 C 266 160, 268 136, 272 112" stroke-width="3.4"/>
      <path d="M270 146 l -18 -16 M271 128 l 16 -14"/>
      <path d="M236 106 C 236 72, 272 56, 296 72 C 322 64, 340 90, 324 110 C 330 128, 302 140, 282 130 C 258 134, 232 122, 236 106 z" fill="url(#rs-hatch)"/>
      <g stroke-width="1.3" opacity="0.65">
        <path d="M252 98 C 264 90, 282 88, 296 94"/>
        <path d="M256 116 C 270 108, 290 108, 304 114"/>
      </g>
      <g stroke-width="1.5" opacity="0.8">
        <path d="M268 194 L 268 252 M268 212 l -26 20 M268 226 l 26 18 M268 240 l -16 16"/>
      </g>
    </g>

    <!-- regador -->
    <g stroke-width="2.4">
      <path d="M330 168 L 386 164 L 380 208 L 336 210 z" fill="#FFFFFF"/>
      <path d="M340 168 C 338 152, 356 148, 360 160" stroke-width="2"/>
      <path d="M330 176 L 306 164 L 300 172 L 328 190" fill="#FFFFFF"/>
      <g stroke="#0EA5E9" stroke-width="1.8" opacity="0.85">
        <path d="M302 178 C 298 186, 296 192, 298 198"/>
        <path d="M310 180 C 306 188, 305 194, 307 200"/>
        <path d="M318 182 C 314 190, 313 196, 315 202"/>
      </g>
    </g>

    <!-- setas de progressão -->
    <g stroke-width="1.6" stroke-dasharray="7 6" opacity="0.75">
      <path d="M78 150 C 96 138, 110 136, 120 140"/>
      <path d="M116 136 l 8 5 l -8 5"/>
      <path d="M180 120 C 200 106, 216 104, 228 108"/>
      <path d="M224 104 l 8 5 l -8 5"/>
    </g>
  </g>
</svg>
