<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ilustração de carta topográfica com curvas de nível, rio e rosa dos ventos">
  <defs>
    <filter id="cg-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cg-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="cg-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#15803D" stroke-width="1.1" opacity="0.5"/>
    </pattern>
    <pattern id="cg-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D97706" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#F7FAF5"/>
  <rect width="400" height="300" filter="url(#cg-grain)" opacity="0.07"/>

  <g filter="url(#cg-rough)" fill="none" stroke="#14532D" stroke-linecap="round" stroke-linejoin="round">
    <!-- folha da carta -->
    <path d="M30 26 L 352 20 L 368 268 L 44 278 z" fill="#FFFFFF" stroke-width="2.6"/>
    <path d="M352 20 L 336 44 L 368 268" stroke-width="1.6" opacity="0.5"/>

    <!-- moldura interna e ticks -->
    <path d="M48 44 L 336 38 L 350 252 L 60 260 z" stroke-width="1.5" opacity="0.85"/>
    <g stroke-width="1.2" opacity="0.7">
      <path d="M110 40 l0 -8 M172 39 l0 -8 M234 38 l0 -8 M296 37 l0 -8"/>
      <path d="M118 257 l0 8 M180 256 l0 8 M242 255 l0 8 M304 254 l0 8"/>
      <path d="M50 84 l-8 0 M52 124 l-8 0 M54 164 l-8 0 M56 204 l-8 0"/>
      <path d="M340 78 l8 0 M342 118 l8 0 M344 158 l8 0 M346 198 l8 0"/>
    </g>

    <!-- curvas de nível -->
    <g stroke-width="1.6" opacity="0.9">
      <path d="M92 214 C 110 168, 150 150, 196 156 C 240 162, 268 188, 276 216"/>
      <path d="M106 216 C 122 178, 154 162, 194 168 C 230 174, 254 194, 262 218"/>
      <path d="M120 218 C 134 188, 158 174, 192 180 C 220 186, 240 200, 248 220"/>
      <path d="M136 220 C 146 198, 164 188, 190 192 C 212 196, 226 206, 232 222"/>
      <path d="M152 222 C 158 208, 172 200, 188 204 C 202 208, 212 212, 216 224"/>
    </g>
    <g stroke-width="1.4" opacity="0.75">
      <path d="M232 92 C 254 68, 292 66, 312 86"/>
      <path d="M240 100 C 258 80, 288 79, 304 95"/>
      <path d="M250 108 C 262 94, 282 93, 294 104"/>
    </g>

    <!-- rio e afluentes -->
    <g stroke="#0EA5E9" stroke-width="2.4" opacity="0.9">
      <path d="M58 120 C 106 128, 128 104, 172 116 C 214 128, 238 116, 276 132 C 310 146, 328 140, 346 146"/>
    </g>
    <g stroke="#0EA5E9" stroke-width="1.5" opacity="0.75">
      <path d="M128 106 C 132 86, 148 76, 156 60"/>
      <path d="M212 122 C 208 146, 216 162, 210 180"/>
      <path d="M276 132 C 286 112, 300 106, 306 92"/>
    </g>

    <!-- mancha de vegetação e área urbana -->
    <path d="M74 58 C 108 44, 146 50, 156 72 C 166 94, 132 108, 100 100 C 72 94, 60 72, 74 58 z" fill="url(#cg-hatch)" stroke-width="1.6"/>
    <path d="M250 196 L 302 190 L 310 222 L 258 230 z" fill="url(#cg-dots)" stroke-width="1.5" stroke-dasharray="6 5"/>

    <!-- rosa dos ventos -->
    <g stroke-width="2">
      <circle cx="312" cy="66" r="19" fill="#FFFFFF"/>
      <path d="M312 48 L 318 66 L 312 84 L 306 66 z" fill="#14532D"/>
      <path d="M294 66 l 36 0" stroke-width="1.2" opacity="0.7"/>
      <text x="312" y="43" font-family="Georgia, serif" font-size="12" fill="#14532D" text-anchor="middle" stroke="none">N</text>
    </g>

    <!-- escala gráfica -->
    <g stroke-width="1.6">
      <rect x="72" y="236" width="22" height="8" fill="#14532D"/>
      <rect x="94" y="236" width="22" height="8" fill="#FFFFFF"/>
      <rect x="116" y="236" width="22" height="8" fill="#14532D"/>
      <text x="146" y="245" font-family="Georgia, serif" font-size="11" fill="#14532D" stroke="none">km</text>
    </g>
  </g>
</svg>
