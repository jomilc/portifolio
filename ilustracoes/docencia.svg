<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ilustração de lousa com fórmula de NDVI, livros e material de aula">
  <defs>
    <filter id="dc-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="dc-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="6"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dc-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#BBF7D0" stroke-width="1.1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="#F7FAF5"/>
  <rect width="400" height="300" filter="url(#dc-grain)" opacity="0.07"/>

  <g filter="url(#dc-rough)" fill="none" stroke="#14532D" stroke-linecap="round" stroke-linejoin="round">
    <!-- lousa -->
    <g stroke-width="2.8">
      <path d="M36 28 L 366 22 L 372 214 L 42 222 z" fill="#14532D"/>
      <path d="M50 40 L 354 34 L 359 202 L 55 210 z" stroke="#BBF7D0" stroke-width="1.4" opacity="0.6"/>
    </g>

    <!-- conteúdo escrito na lousa -->
    <g stroke="#ECFDF5" stroke-width="2.2" opacity="0.95">
      <!-- fórmula NDVI -->
      <text x="72" y="82" font-family="Georgia, serif" font-size="26" fill="#ECFDF5" stroke="none">NDVI =</text>
      <path d="M186 74 l 108 0" stroke-width="2"/>
      <text x="196" y="68" font-family="Georgia, serif" font-size="19" fill="#ECFDF5" stroke="none">NIR − R</text>
      <text x="196" y="98" font-family="Georgia, serif" font-size="19" fill="#ECFDF5" stroke="none">NIR + R</text>

      <!-- eixo e curva -->
      <path d="M78 190 L 78 118 M78 190 L 208 190" stroke-width="2"/>
      <path d="M84 178 C 108 176, 124 150, 146 146 C 168 142, 184 128, 202 126" stroke="#86EFAC" stroke-width="2.4"/>
      <g stroke-width="1.3" opacity="0.65">
        <path d="M74 146 l 8 0 M74 162 l 8 0 M114 190 l 0 7 M154 190 l 0 7 M194 190 l 0 7"/>
      </g>

      <!-- folha esquemática -->
      <g stroke="#86EFAC" stroke-width="2">
        <path d="M262 132 C 286 112, 320 118, 328 140 C 336 164, 310 186, 284 178 C 264 172, 252 150, 262 132 z"/>
        <path d="M268 172 C 286 160, 306 146, 322 134"/>
        <path d="M282 166 l 8 -14 M296 158 l 8 -14 M306 148 l 8 -12"/>
      </g>
    </g>

    <!-- apagador e giz -->
    <g stroke-width="2">
      <rect x="292" y="196" width="40" height="12" rx="3" fill="#ECFDF5"/>
      <path d="M252 204 l 26 -3" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- bancada -->
    <path d="M16 238 L 386 230" stroke-width="3"/>

    <!-- pilha de livros -->
    <g stroke-width="2.2">
      <path d="M52 230 L 148 226 L 150 244 L 54 248 z" fill="#FFFFFF"/>
      <path d="M60 212 L 142 208 L 144 226 L 62 230 z" fill="#ECFDF5"/>
      <path d="M68 196 L 134 192 L 136 208 L 70 212 z" fill="#FFFFFF"/>
      <g stroke-width="1.3" opacity="0.7">
        <path d="M60 238 l 84 -3 M68 220 l 70 -3 M76 204 l 54 -3"/>
      </g>
    </g>

    <!-- caderno e caneta -->
    <g stroke-width="2.2">
      <path d="M232 236 L 322 230 L 326 268 L 236 274 z" fill="#FFFFFF"/>
      <path d="M232 236 L 236 274" stroke-width="3"/>
      <g stroke-width="1.4" opacity="0.75">
        <path d="M248 248 l 62 -4 M250 258 l 62 -4"/>
      </g>
      <path d="M338 236 L 360 262" stroke-width="3.4"/>
      <path d="M358 260 l 6 8" stroke-width="2"/>
    </g>
  </g>
</svg>
